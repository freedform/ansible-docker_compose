---
- name: Validate variables for upload_config.yml task
  ansible.builtin.assert:
    that:
      - docker_compose_file_owner is defined
      - docker_compose_file_group is defined
      - docker_compose_dest_dir is defined
      - docker_compose_config is defined

- name: Create destination directory
  ansible.builtin.file:
    path: "{{ docker_compose_dest_dir }}"
    state: directory
    owner: "{{ docker_compose_file_owner }}"
    group: "{{ docker_compose_file_group }}"
    mode: "0755"

- name: Upload docker-compose config
  ansible.builtin.copy:
    content: "{{ docker_compose_config | to_nice_yaml }}"
    dest: "{{ docker_compose_dest_dir }}/docker-compose.yml"
    owner: "{{ docker_compose_file_owner }}"
    group: "{{ docker_compose_file_group }}"
    mode: "0644"
