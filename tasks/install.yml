---
- name: Validate variables for install action
  ansible.builtin.assert:
    that:
      - docker_compose_docker_version is defined
      - docker_compose_docker_version | length > 0
      - docker_compose_containerd_version is defined
      - docker_compose_containerd_version | length > 0
      - docker_compose_buildx_version is defined
      - docker_compose_buildx_version | length > 0
      - docker_compose_version is defined
      - docker_compose_version | length > 0
    fail_msg: "All docker_compose version variables must be defined and non-empty"

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Gather distribution facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - min
    filter: ansible_distribution_release

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: _dpkg_arch
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ _dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] {{ docker_compose_docker_repo }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - "docker-ce={{ docker_compose_docker_version }}"
      - "docker-ce-cli={{ docker_compose_docker_version }}"
      - "containerd.io={{ docker_compose_containerd_version }}"
      - "docker-buildx-plugin={{ docker_compose_buildx_version }}"
      - "docker-compose-plugin={{ docker_compose_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    enabled: true

- name: Enable Containerd service
  ansible.builtin.service:
    name: containerd
    enabled: true
